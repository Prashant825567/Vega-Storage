[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storage-backend"
version = "0.1.0"
description = "MTProto (Telethon) channel-backed storage for ZentraGrid-compatible API"
requires-python = ">=3.10"
dependencies = [
    "telethon>=1.45.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["storage_backend*", "app*"]